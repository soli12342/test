name: Run Python

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "**.py"
      - ".github/workflows/run-python.yml"

jobs:
  run-python:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install pytest

      - name: Run hello.py
        run: python hello.py

      - name: Run calculator example
        run: python calculator.py 3 + 4

      - name: Run tests
        run: pytest -q
