name: Run Python

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "hello.py"
      - ".github/workflows/run-python.yml"

jobs:
  run-python:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run hello.py
        run: python hello.py
