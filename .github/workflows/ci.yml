name: APR M0-M2 CI
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, 'codex/**']
    paths-ignore: ['hello.py', '.github/workflows/run-python.yml']
permissions:
  contents: read
concurrency:
  group: apr-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install -r requirements-dev.lock
      - run: npm run lint && npm run typecheck && npm test && npm run test:db && npm run build
      - run: ruff check jobs && mypy jobs && python -m pytest -q
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      # No external data requests, real credentials, source artifacts or paid calls.
