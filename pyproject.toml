[project]
name = "apr-research-jobs"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["jsonschema[format]==4.25.1"]
[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.13.1", "mypy==1.18.2", "types-jsonschema==4.25.1.20250822"]
[tool.pytest.ini_options]
testpaths = ["jobs/tests"]
pythonpath = ["."]
[tool.ruff]
line-length = 110
[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true
